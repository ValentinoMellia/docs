<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filters -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-desafios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="grad-mercado" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Marker Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="680" fill="#ffffff" />

  <!-- CONNECTIONS & ARROWS -->
  
  <!-- 1. Desafios -> Roadmap (Base XP) -->
  <path d="M 450 110 L 250 215" fill="none" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 2. Desafios -> Banco (Base Coins) -->
  <path d="M 750 110 L 950 215" fill="none" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 3. Desafios -> Mercado (Spy Observer - Dashed Line) -->
  <path d="M 600 135 L 600 500" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-dashed)" />

  <!-- 4a. Mercado -> Roadmap (Bono XP / Escudo) -->
  <path d="M 460 515 Q 260 430 260 295" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)" />

  <!-- 4b. Mercado -> Banco (Bono Monedas) -->
  <path d="M 740 515 Q 940 430 940 295" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)" />

  <!-- STEP BADGE 1 & LABEL -->
  <g transform="translate(145, 115)">
    <circle cx="20" cy="20" r="15" fill="#1e3a8a" />
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">1</text>
    <text x="44" y="16" fill="#1e293b" font-size="12" font-weight="600">Acredita XP base (+100 XP)</text>
    <text x="44" y="32" fill="#64748b" font-size="11.5">o resta -1 vida si reprueba</text>
  </g>

  <!-- STEP BADGE 2 & LABEL -->
  <g transform="translate(865, 115)">
    <circle cx="20" cy="20" r="15" fill="#1e3a8a" />
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">2</text>
    <text x="44" y="16" fill="#1e293b" font-size="12" font-weight="600">Acredita monedas base (+50)</text>
    <text x="44" y="32" fill="#64748b" font-size="11.5">directamente en el ledger</text>
  </g>

  <!-- CENTRAL DASHED BOX (Desacople Total) -->
  <g transform="translate(450, 240)">
    <rect x="0" y="0" width="300" height="90" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="6,5" filter="url(#soft-shadow)" />
    <text x="150" y="32" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Base Directa + Bonos Asíncronos</text>
    <text x="150" y="52" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">(Desacople Total de Mercado)</text>
    <text x="150" y="72" text-anchor="middle" fill="#64748b" font-size="11">Cero intermediación forzada en el core</text>
  </g>

  <!-- STEP BADGE 3 (OBSERVER SPY) -->
  <g transform="translate(460, 425)">
    <circle cx="20" cy="20" r="15" fill="#1e3a8a" />
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">3</text>
    <text x="44" y="15" fill="#1e293b" font-size="12" font-weight="600">Mercado observa en paralelo</text>
    <text x="44" y="31" fill="#64748b" font-size="11.5">Si no hay ítems: Silencio total (cero eventos)</text>
  </g>

  <!-- STEP BADGE 4a & LABEL -->
  <g transform="translate(85, 380)">
    <circle cx="15" cy="15" r="14" fill="#0d9488" />
    <text x="15" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">4a</text>
    <text x="36" y="14" fill="#0f766e" font-size="12" font-weight="700">ITEM_BONUS_APPLIED (+XP extra)</text>
    <text x="36" y="30" fill="#0f766e" font-size="12" font-weight="700">o ITEM_SHIELD_TRIGGERED (+1 vida)</text>
  </g>

  <!-- STEP BADGE 4b & LABEL -->
  <g transform="translate(870, 380)">
    <circle cx="15" cy="15" r="14" fill="#0d9488" />
    <text x="15" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">4b</text>
    <text x="36" y="14" fill="#0f766e" font-size="12" font-weight="700">ITEM_BONUS_APPLIED</text>
    <text x="36" y="30" fill="#0f766e" font-size="12" font-weight="700">(+Monedas extra aditivas)</text>
  </g>

  <!-- ==================== NODE 1: DESAFÍOS (TEMA 03) ==================== -->
  <g transform="translate(425, 45)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="84" rx="16" fill="url(#grad-desafios)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Target Bullseye Icon -->
    <g transform="translate(24, 20)">
      <circle cx="22" cy="22" r="20" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="22" cy="22" r="12" fill="none" stroke="#ffffff" stroke-width="2" />
      <circle cx="22" cy="22" r="4" fill="#ffffff" />
      <path d="M 32 12 L 40 4 M 35 4 L 40 4 L 40 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <text x="84" y="38" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.3">Desafíos · Tema 03</text>
    <text x="84" y="60" fill="#e9d5ff" font-size="13" font-weight="500">hecho pedagógico (100% agnóstico)</text>
  </g>

  <!-- ==================== NODE 2: ROADMAP (TEMA 10) ==================== -->
  <g transform="translate(60, 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="84" rx="16" fill="url(#grad-green)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Bar Chart Icon -->
    <g transform="translate(24, 20)">
      <rect x="4" y="24" width="6" height="16" rx="2" fill="#ffffff" />
      <rect x="14" y="16" width="6" height="24" rx="2" fill="#ffffff" />
      <rect x="24" y="6" width="6" height="34" rx="2" fill="#ffffff" />
      <path d="M 8 16 L 27 3 M 20 3 L 27 3 L 27 10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <text x="78" y="38" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.3">Roadmap · Tema 10</text>
    <text x="78" y="60" fill="#dcfce7" font-size="13" font-weight="500">XP base, niveles y vidas</text>
  </g>

  <!-- Callout Roadmap: Flujo Autónomo -->
  <g transform="translate(60, 305)">
    <!-- Speech bubble shape with tail pointing up -->
    <path d="M 20 12 L 140 12 L 148 0 L 156 12 L 270 12 Q 282 12 282 24 L 282 64 Q 282 76 270 76 L 20 76 Q 8 76 8 64 L 8 24 Q 8 12 20 12 Z" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#soft-shadow)" />
    <!-- Star Icon -->
    <path d="M 30 42 L 34 32 L 44 32 L 36 38 L 39 48 L 30 42 Z" fill="#16a34a" />
    <text x="50" y="36" fill="#15803d" font-size="12" font-weight="700">Flujo Base Autónomo:</text>
    <text x="50" y="52" fill="#334155" font-size="11.5">Si Mercado se cae, el alumno cobra</text>
    <text x="50" y="66" fill="#334155" font-size="11.5">su XP y avanza normalmente.</text>
  </g>

  <!-- ==================== NODE 3: BANCO (TEMA 08) ==================== -->
  <g transform="translate(790, 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="84" rx="16" fill="url(#grad-green)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Bank Building Icon -->
    <g transform="translate(24, 22)">
      <path d="M 4 14 L 22 4 L 40 14 Z" fill="#ffffff" />
      <rect x="8" y="16" width="5" height="18" fill="#ffffff" />
      <rect x="19" y="16" width="5" height="18" fill="#ffffff" />
      <rect x="30" y="16" width="5" height="18" fill="#ffffff" />
      <rect x="3" y="35" width="38" height="4" rx="1" fill="#ffffff" />
    </g>

    <text x="80" y="38" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.3">Banco · Tema 08</text>
    <text x="80" y="60" fill="#dcfce7" font-size="13" font-weight="500">ledger y saldos base</text>
  </g>

  <!-- Callout Banco: Monedas -->
  <g transform="translate(850, 305)">
    <!-- Speech bubble shape with tail pointing up -->
    <path d="M 20 12 L 110 12 L 118 0 L 126 12 L 280 12 Q 292 12 292 24 L 292 64 Q 292 76 280 76 L 20 76 Q 8 76 8 64 L 8 24 Q 8 12 20 12 Z" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#soft-shadow)" />
    <!-- Coins Icon -->
    <ellipse cx="30" cy="40" rx="10" ry="5" fill="none" stroke="#16a34a" stroke-width="1.8" />
    <path d="M 20 40 v 6 c 0 3 4.5 5 10 5 s 10 -2 10 -5 v -6" fill="none" stroke="#16a34a" stroke-width="1.8" />
    <path d="M 20 46 v 6 c 0 3 4.5 5 10 5 s 10 -2 10 -5 v -6" fill="none" stroke="#16a34a" stroke-width="1.8" />
    <text x="50" y="36" fill="#15803d" font-size="12" font-weight="700">Acreditación Directa:</text>
    <text x="50" y="52" fill="#334155" font-size="11.5">Las monedas base van al saldo</text>
    <text x="50" y="66" fill="#334155" font-size="11.5">sin pasar por Mercado.</text>
  </g>

  <!-- ==================== NODE 4: MERCADO (TEMA 09) ==================== -->
  <g transform="translate(400, 510)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="92" rx="16" fill="url(#grad-mercado)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Shopping Cart + Spy Icon -->
    <g transform="translate(24, 24)">
      <path d="M 2 4 L 8 4 L 14 26 L 36 26 L 40 10 L 12 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="16" cy="34" r="3.5" fill="#ffffff" />
      <circle cx="34" cy="34" r="3.5" fill="#ffffff" />
    </g>

    <text x="82" y="40" fill="#ffffff" font-size="21" font-weight="800" letter-spacing="-0.3">Mercado · Tema 09</text>
    <text x="82" y="64" fill="#ccfbf1" font-size="13.5" font-weight="600">el espía silencioso (observador asíncrono)</text>
  </g>

  <!-- Callout Mercado: Compensación Escudo y Bonos -->
  <g transform="translate(100, 520)">
    <!-- Speech bubble pointing right to Mercado -->
    <path d="M 12 8 L 260 8 Q 272 8 272 20 L 272 32 L 284 40 L 272 48 L 272 68 Q 272 80 260 80 L 12 80 Q 0 80 0 68 L 0 20 Q 0 8 12 8 Z" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#soft-shadow)" />
    <!-- Shield Icon -->
    <path d="M 24 30 L 24 44 Q 24 52 32 56 Q 40 52 40 44 L 40 30 Q 32 26 24 30 Z" fill="none" stroke="#0d9488" stroke-width="2" />
    <text x="48" y="32" fill="#0f766e" font-size="12" font-weight="700">Compensación por Escudo:</text>
    <text x="48" y="48" fill="#334155" font-size="11.5">Si el alumno falla, Roadmap resta vida</text>
    <text x="48" y="64" fill="#334155" font-size="11.5">y Mercado la restituye asíncronamente.</text>
  </g>

  <!-- Callout Mercado: Idempotencia y Replay -->
  <g transform="translate(820, 520)">
    <!-- Speech bubble pointing left to Mercado -->
    <path d="M 24 8 L 270 8 Q 282 8 282 20 L 282 68 Q 282 80 270 80 L 24 80 Q 12 80 12 68 L 12 48 L 0 40 L 12 32 L 12 20 Q 12 8 24 8 Z" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#soft-shadow)" />
    <text x="32" y="32" fill="#0f766e" font-size="12" font-weight="700">Tolerancia a Caídas:</text>
    <text x="32" y="48" fill="#334155" font-size="11.5">Si Mercado cae, al reconectar drena Kafka</text>
    <text x="32" y="64" fill="#334155" font-size="11.5">y liquida bonos contra attemptTimestamp.</text>
  </g>

</svg>
